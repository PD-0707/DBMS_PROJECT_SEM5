<!DOCTYPE html>
<html>
<head>
  <title>Likes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Likes</h2>
  <input type="text" id="likerIdInput" placeholder="Enter Liker ID (e.g. U1)" />
  <button onclick="searchByLiker()">Search</button>
  <button onclick="loadAllLikes()">Reset</button>
  <table>
    <thead>
      <tr>
        <th>Like ID</th>
        <th>Liker</th>
        <th>Liked</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody id="likeTable"></tbody>
  </table>

  <script>
   function loadAllLikes() {
      fetch('http://127.0.0.1:5000/likes')
        .then(res => res.json())
        .then(renderLikes)
        .catch(console.error);
    }

    function searchByLiker() {
      const likerId = document.getElementById('likerIdInput').value.trim();
      if (!likerId) {
        alert('Please enter a Liker ID');
        return;
      }
      fetch(`http://127.0.0.1:5000/likes/by_liker/${likerId}`)
        .then(res => res.json())
        .then(renderLikes)
        .catch(console.error);
    }

    function renderLikes(likes) {
      const tbody = document.getElementById('likeTable');
      tbody.innerHTML = '';
      likes.forEach(like => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${like.LIKE_ID}</td>
          <td>${like.LIKER_ID}</td>
          <td>${like.LIKED_ID}</td>
          <td>${like.LIKE_TIME}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Initial load all likes
    loadAllLikes();
  </script>
</body>
</html>
